name: Build desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest       # Apple Silicon
            artifact: dist/InvestTrack-macos-arm64.dmg
          - os: macos-15-intel     # Intel
            artifact: dist/InvestTrack-macos-x64.dmg
          - os: windows-latest
            artifact: dist/InvestTrack-windows-x64.zip
    runs-on: ${{ matrix.os }}
    env:
      INVESTTRACK_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: ./build_mac.sh

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build_win.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
